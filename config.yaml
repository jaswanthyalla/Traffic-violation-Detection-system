batch_size: 1
camera_source: webcam
capture_mode: offline
confidence_threshold: 0.45
database_path: violations.db
detection_model: yolov8n.pt
device: cpu
helmet_detection_enabled: true
helmet_model: models/yolo_helmet.pt
max_riders: 2
online_capture:
  buffer_size: 30
  enabled: false
  fps: 15
  frame_height: 480
  frame_width: 640
  violation_save_interval: 30
output_dir: output
overload_detection_enabled: true
plate_detection_enabled: true
plate_model: models/yolo_plate.pt
screenshot_interval: 5
screenshot_quality: 95
#stream_url:"rtsp://username:password@192.168.1.100:554/stream1"
# OR if it's an HTTP stream:
stream_url: null

vehicle_model: models/yolo_vehicle.pt
video_path: null
web_server:
  auto_refresh_rate: 10000
  debug: true
  host: 0.0.0.0
  port: 5000
webcam_device: 0
