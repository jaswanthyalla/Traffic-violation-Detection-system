<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Traffic Violation System</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { 
            background-color: #0b1120 !important; 
            color: #f1f5f9 !important; 
            font-family: 'Inter', sans-serif !important;
            margin: 0;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-[#0b1120] to-[#122345]">

    <div class="w-full max-w-md px-6">
        <div class="text-center mb-10">
            <div class="w-16 h-16 rounded-2xl bg-blue-600 flex items-center justify-center text-white text-3xl mx-auto mb-6 shadow-xl shadow-blue-600/20">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1 class="text-3xl font-bold text-white tracking-wide">Register Account</h1>
            <p class="text-slate-400 mt-2">Create an operator account for the dashboard</p>
        </div>

        <div class="bg-[#1a2030] border border-[#262f44] rounded-2xl p-8 shadow-2xl">
            {% if error %}
            <div class="bg-rose-500/10 border border-rose-500/30 rounded-lg p-4 mb-6 flex items-start gap-3">
                <i class="fa-solid fa-triangle-exclamation text-rose-500 mt-0.5"></i>
                <p class="text-sm text-rose-400 font-medium">{{ error }}</p>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('signup') }}">
                <div class="space-y-5">
                    <div>
                        <label for="name" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Full Name</label>
                        <div class="relative">
                            <i class="fa-solid fa-id-badge absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                            <input type="text" name="name" id="name" required class="w-full bg-[#111623] border border-[#262f44] text-white rounded-lg pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors" placeholder="John Doe">
                        </div>
                    </div>

                    <div>
                        <label for="username" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Username / Operator ID</label>
                        <div class="relative">
                            <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                            <input type="text" name="username" id="username" required class="w-full bg-[#111623] border border-[#262f44] text-white rounded-lg pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors" placeholder="johndoe123">
                        </div>
                    </div>
                    
                    <div>
                        <label for="password" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Password</label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                            <input type="password" name="password" id="password" required class="w-full bg-[#111623] border border-[#262f44] text-white rounded-lg pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors" placeholder="Create a strong password">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-[#2563eb] hover:bg-blue-600 text-white font-bold py-3.5 px-4 rounded-lg transition-colors text-sm shadow-lg shadow-blue-600/30 mt-6 flex items-center justify-center gap-2">
                        Create Account <i class="fa-solid fa-check"></i>
                    </button>
                </div>
            </form>
        </div>
        
        <p class="text-center text-sm text-slate-400 mt-6">
            Already have an account? <a href="{{ url_for('login') }}" class="text-blue-500 font-bold hover:text-blue-400">Log In</a>
        </p>

        <p class="text-center text-xs text-slate-500 mt-8">
            &copy; 2026 Traffic Violation Detection System.
        </p>
    </div>

</body>
</html>
